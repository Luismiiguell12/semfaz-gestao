# Aplica migrations, seed estrutural e Edge Functions nos projetos Supabase
# REMOTOS. Nunca a partir do navegador. Segredos ficam nos "environments" do
# GitHub (staging/production), e production exige aprovação manual.
name: Supabase migrations

on:
  push:
    branches: [main]
    paths: ["supabase/**"]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de destino
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: supabase-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Verificar configuração do ambiente
        id: config
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::notice::Ambiente sem projeto Supabase configurado (secrets ausentes). Migrations não aplicadas."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.config.outputs.ready == 'true'
        uses: actions/checkout@v7
      - if: steps.config.outputs.ready == 'true'
        uses: supabase/setup-cli@v3
        with:
          version: 3.4.0
      - name: Vincular projeto
        if: steps.config.outputs.ready == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Migrations pendentes (prévia)
        if: steps.config.outputs.ready == 'true'
        run: supabase migration list --remote --password "$SUPABASE_DB_PASSWORD"
      - name: Aplicar migrations e seed estrutural (idempotente)
        if: steps.config.outputs.ready == 'true'
        run: supabase db push --remote --include-seed --yes --password "$SUPABASE_DB_PASSWORD"
      - name: Configurar autenticação (endereços, cadastro, senha e MFA)
        if: steps.config.outputs.ready == 'true'
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          test -n "$APP_URL" || { echo "Defina a variável APP_URL do ambiente."; exit 1; }
          patch_auth() {
            curl -sS -o response.json -w '%{http_code}' -X PATCH \
              "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth" \
              -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
              -H "Content-Type: application/json" --data "$1"
          }
          settings=$(jq -n --arg site "$APP_URL" '{
            site_url: $site,
            uri_allow_list: ($site + "/**"),
            disable_signup: true,
            password_min_length: 10,
            password_required_characters: "abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789",
            security_update_password_require_reauthentication: true,
            mfa_totp_enroll_enabled: true,
            mfa_totp_verify_enabled: true,
            mailer_otp_length: 6,
            mailer_otp_exp: 3600
          }')
          status=$(patch_auth "$settings")
          echo "Configurações de autenticação: HTTP $status"
          if [ "$status" -ge 300 ]; then jq -r '.message // .error // "sem detalhes"' response.json; rm -f response.json; exit 1; fi

          # Modelos de e-mail com código de 6 números. No plano gratuito com o
          # servidor de e-mail padrão do Supabase isso não é permitido: segue com aviso.
          templates=$(jq -n \
            --rawfile invite supabase/templates/invite.html \
            --rawfile recovery supabase/templates/recovery.html '{
              mailer_subjects_invite: "Seu código de primeiro acesso ao SEMFAZ Gestão",
              mailer_templates_invite_content: $invite,
              mailer_subjects_recovery: "Código para redefinir sua senha no SEMFAZ Gestão",
              mailer_templates_recovery_content: $recovery
            }')
          status=$(patch_auth "$templates")
          echo "Modelos de e-mail: HTTP $status"
          if [ "$status" -ge 300 ]; then
            echo "::warning::Modelos de e-mail não aplicados: $(jq -r '.message // .error // "sem detalhes"' response.json). Os e-mails seguem com link (padrão do Supabase)."
          fi
          rm -f response.json
      - name: Configurar variáveis das Edge Functions (não secretas)
        if: steps.config.outputs.ready == 'true'
        run: |
          supabase secrets set --yes \
            ALLOWED_ORIGINS="${{ vars.ALLOWED_ORIGINS }}" \
            APP_URL="${{ vars.APP_URL }}"
      - name: Publicar Edge Functions
        if: steps.config.outputs.ready == 'true'
        run: supabase functions deploy --use-api --yes
