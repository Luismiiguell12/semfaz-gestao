# Publicação do frontend estático no GitHub Pages após CI aprovada na main.
# Só valores PÚBLICOS entram no build (URL e chave anon do Supabase de produção),
# configurados como "variables" do ambiente "github-pages". Nenhum segredo.
name: Deploy GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: github-pages
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A conferência usa expressões avaliadas pelo GitHub, sem imprimir os valores:
      # se um segredo for colado por engano numa variável, ele não aparece no registro público.
      - name: Verificar configuração pública
        if: >-
          ${{ !(
            startsWith(vars.NEXT_PUBLIC_SUPABASE_URL, 'https://') &&
            endsWith(vars.NEXT_PUBLIC_SUPABASE_URL, '.supabase.co') &&
            (startsWith(vars.NEXT_PUBLIC_SUPABASE_ANON_KEY, 'eyJ') || startsWith(vars.NEXT_PUBLIC_SUPABASE_ANON_KEY, 'sb_publishable_')) &&
            !contains(vars.NEXT_PUBLIC_SUPABASE_ANON_KEY, 'c2VydmljZV9yb2xl') &&
            !contains(vars.NEXT_PUBLIC_SUPABASE_ANON_KEY, 'NlcnZpY2Vfcm9sZ') &&
            !contains(vars.NEXT_PUBLIC_SUPABASE_ANON_KEY, 'zZXJ2aWNlX3JvbG')
          ) }}
        run: |
          echo "::error::Configuração inválida no ambiente github-pages. NEXT_PUBLIC_SUPABASE_URL deve ser https://<codigo>.supabase.co e NEXT_PUBLIC_SUPABASE_ANON_KEY deve ser a chave PÚBLICA (anon, começa com eyJ, ou publishable, começa com sb_publishable_). Nunca coloque tokens (sbp_), chaves secretas (sb_secret_) ou a service_role em variáveis."
          exit 1
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_APP_ENV: ${{ vars.NEXT_PUBLIC_APP_ENV || 'production' }}
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
